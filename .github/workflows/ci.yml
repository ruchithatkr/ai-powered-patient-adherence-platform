name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.in
      - name: Format + lint
        run: ruff format --check . && ruff check .
      - name: Types
        run: mypy .
      - name: Unit / integration / safety / property / contract tests
        run: pytest --cov --cov-report=xml
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: SAST
        run: bandit -q -r . -c pyproject.toml
      - name: Dependency scan
        run: pip-audit -r requirements.lock --require-hashes
      - name: SBOM
        run: cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.json}
      - name: Eval release gates
        run: python -m evals.run_evals >/dev/null
      - name: Change-control gate
        run: python scripts/check_change_approvals.py
