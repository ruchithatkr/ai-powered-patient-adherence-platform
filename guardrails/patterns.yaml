# Deterministic detection patterns (case-insensitive, matched on normalized text). Versioned.
version: PATTERNS-2
injection:
  - 'ignore\s+(?:\w+\s+){0,3}(?:instructions?|rules?|directions?|prompts?|guidelines?|polic(?:y|ies))'
  - '(?:disregard|forget|drop)\s+(?:\w+\s+){0,4}(?:instructions?|rules?|polic(?:y|ies)|guardrails?|safety)'
  - 'you\s+are\s+now\b'
  - 'act\s+as\s+(?:an?\s+)?(?:admin|administrator|root|developer|system|pharmacist|doctor|clinician)'
  - 'system\s+prompt'
  - 'developer\s+mode|jailbreak|\bdan\s+mode'
  - 'reveal\s+(?:\w+\s+){0,3}(?:prompt|secret|key|instructions?|password|token)'
  - '(?:override|bypass|circumvent|disable|turn\s+off)\s+(?:\w+\s+){0,3}(?:guardrails?|polic(?:y|ies)|approval|safety|consent|filters?)'
  - 'skip\s+(?:\w+\s+){0,2}(?:approval|review|consent|guardrails?|checks?)'
  - 'without\s+(?:\w+\s+){0,2}(?:approval|review|consent)'
  - 'pretend\s+(?:to\s+be|you\s+are)'
  - 'new\s+instructions?\s*:'
  - '<\s*/?\s*(?:system|assistant|instructions?)\s*>|\[/?inst\]|###\s*(?:system|instruction)'
  - 'approve\s+(?:this|it|the\s+request)\s+(?:automatically|yourself)'
secrets:
  - 'sk-[a-z0-9_-]{16,}'
  - 'akia[0-9a-z]{16}'
  - 'bearer\s+[a-z0-9\-_.=]{20,}'
  - '(?:password|passwd|pwd)\s*[:=]'
  - '-----begin\s+(?:rsa\s+|ec\s+|openssh\s+)?private\s+key-----'
  - 'gh[pousr]_[a-z0-9]{30,}'
  - 'xox[baprs]-[a-z0-9-]{10,}'
  - '(?:api[_-]?key|secret|token)\s*[:=]\s*\S{8,}'
  - 'eyj[a-z0-9_-]{10,}\.eyj[a-z0-9_-]{10,}'
phi:
  - '\b\d{3}-\d{2}-\d{4}\b'
  - '[\w.+-]+@[\w-]+\.[\w.]+'
  - '(?<!\d)(?:\+?\d{1,3}[\s.-]?)?(?:\(\d{3}\)|\d{3})[\s.-]?\d{3}[\s.-]?\d{4}(?!\d)'
  - '\+\d{1,3}[\s.-]?\d{4,5}[\s.-]?\d{4,6}'
  - '\b(?:mrn|medical\s+record(?:\s+number)?)\s*[:#]?\s*[a-z0-9-]{5,}'
  - '\b(?:dob|date\s+of\s+birth|born\s+on)\b'
  - '\b\d{1,5}\s+(?:[a-z]+\s+){1,3}(?:street|st|avenue|ave|road|rd|lane|ln|drive|dr|boulevard|blvd)\b'
  - '\b(?:\d[ -]?){13,16}\b'
emergency:
  - 'chest\s+(?:\w+\s+){0,2}(?:pain|tight|pressure|hurts?)|tightness\s+in\s+(?:my\s+)?chest'
  - '(?:can.?t|cannot|hard\s+to|trouble|difficulty|struggling\s+to|unable\s+to)\s+breath|short(?:ness)?\s+of\s+breath|not\s+breathing'
  - 'overdos|took\s+too\s+(?:many|much)|swallowed\s+(?:too|the\s+whole)'
  - 'suicid|kill\s+myself|end\s+my\s+life|want\s+to\s+die|self[\s-]?harm'
  - 'unconscious|passed\s+out|fainted|not\s+responsive|collapsed|seizure'
  - 'allergic\s+reaction|anaphyla|hives|swell(?:ing|en)\s+(?:of\s+)?(?:my\s+|the\s+)?(?:face|lips?|tongue|throat)|swelling'
  - '(?:severe|heavy|uncontrolled)\s+(?:bleeding|pain)|bleeding\s+(?:a\s+lot|heavily)|(?:coughing|vomiting)\s+(?:up\s+)?blood|blood\s+in\s+(?:my\s+)?(?:stool|urine)'
  - 'side\s+effects?|adverse|reaction\s+to\s+(?:my|the)'
  - 'face\s+(?:is\s+)?droop|slurred\s+speech|speech\s+is\s+slurred|sudden\s+numbness'
  - '(?:might|going\s+to|about\s+to)\s+die|feel(?:ing)?\s+(?:very\s+)?faint'
  - '\bambulance\b|\b911\b'
unsafe_content:
  - '\b(?:increase|decrease|double|halve|reduce|skip|stop|discontinue)\b.{0,20}\b(?:dose|dosage|medicine|medication|pill)'
  - '\byou\s+(?:have|likely\s+have|probably\s+have)\b'
  - 'diagnos|prescrib'
  - '\b(?:guarantee[sd]?|cure[sd]?|miracle)\b'
  - '\b(?:buy|discount|limited\s+offer|promo|free\s+trial|act\s+now)\b'
  - '\b(?:you\s+must|or\s+else|irresponsible|ashamed|lazy|your\s+fault|disappointed\s+in\s+you)\b'
  - 'you\s+should\s+(?:take|stop|skip|increase|reduce)'
  - 'take\s+(?:an?\s+)?(?:extra|additional|two|three|double|half)\b'
  - '(?:no\s+need|not\s+necessary)\s+to\s+take|instead\s+of\s+your\s+(?:medicine|medication)|natural\s+(?:cure|remedy)'
